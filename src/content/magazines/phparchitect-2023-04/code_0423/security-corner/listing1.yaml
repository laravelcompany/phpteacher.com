version: "3.5"

networks:
	front:
		name: front

volumes:
	db_data:

services:
	app:
		build:
			context: .
		restart: always
		ports:
			- "8080:8080"
		environment:
			SERVER_PORT: 8080
		networks:
			default:
			front:

	sql:
		image: mysql
		ports:
			- "3306:3306"
		restart: always
		environment:
			MYSQL_ROOT_PASSWORD: root
			MYSQL_DATABASE: project
		volumes:
			- db_data:/var/lib/mysql
		networks:
			default:
			front: